# Nothing reaches production without passing this.
#
# The repository had no automated checks at all, which meant every safeguard was somebody
# remembering to run it by hand. That is how a broken build reached production on 11 September:
# the change was verified locally, against a database, with the dev dependencies installed — none
# of which is what the deploy environment actually looks like.
#
# So this deliberately reproduces the conditions that broke, rather than the conditions that work:
# it builds once with NO database, and once against a real empty one to prove the deploy-time
# migration creates the schema from nothing. Then it starts the built app and asks it for pages,
# because "it compiled" and "it serves" are different claims and only the second one matters.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push makes an older run pointless. Never cancel on main — those runs are the record of
# what was actually shipped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # ── Why 45, and why the browser step has its own ────────────────────────────────────────────
    #
    # It was 20. On 16 September the browser step was still running at 18 minutes, the job hit its
    # limit, and GitHub ended the run as **cancelled** — which sends nobody an email, because a
    # cancellation is what you get when a person presses the button. So CI had not passed for two
    # commits and nothing anywhere said so, on a project whose whole discipline is that a check
    # whose failure mode is silence is worse than no check.
    #
    # Nothing was wrong: the step does a full production build and then walks thirteen journeys in
    # a real browser, and there are thirteen because each one was added the day something got out
    # that every unit test had missed. It needs the time.
    #
    # The step below carries its own budget, and that is the part that matters. A step that runs out
    # of time FAILS, and a failed job is a red run and an email. A job that runs out of time is
    # cancelled, and cancelled is quiet.
    #
    # 20 became 45 and the browser step still ran out at 30. The nine journeys take 205 seconds on a
    # developer machine, all nine, so nothing is hanging — a two-core runner is simply several times
    # slower and nobody had ever measured it. Each journey now reports its own time as an annotation,
    # so the next tightening of this number is done from figures rather than from guessing.
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spec
          POSTGRES_PASSWORD: spec
          POSTGRES_DB: spec_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      # Is the design set whole? Fails if a screen the designs link to was never sent, or if the
      # folder holds screens from more than one export.
      #
      # This was reported rather than enforced, on the reasoning that an incomplete export is a fact
      # about what arrived rather than a fault in the change being tested. That was right while the
      # set was incomplete. It is complete now — 21 screens, one export — and the job of this step
      # has changed from chasing a gap to holding a state, which is what a build check is for.
      - name: Is every design screen actually here
        run: node scripts/design-check.mjs --strict

      # What each design screen says, against what the code says — and now a RATCHET rather than a
      # report. Rewording stays free, because a reworded phrase still counts as present. What cannot
      # happen is coverage going down: wording the product carries today cannot quietly leave it.
      #
      # Both tiers are held. The headline pass covers headings and buttons; --deep covers every
      # label, which is noisier and is where three whole features were once found missing.
      - name: What the designs say, against what the code says
        run: |
          node scripts/design-coverage.mjs --enforce
          node scripts/design-coverage.mjs --deep --enforce

      # The exact shape of the failure that took production down. The public pages need no
      # database, so a build without one has to succeed — if this step ever fails, the marketing
      # site would have gone down over a missing setting.
      - name: Build with no database configured
        run: npm run build
        env:
          DATABASE_URL: ''

      # Proves the deploy-time migration can build the schema from nothing, which is what a new
      # environment looks like on its first deploy.
      - name: Build against an empty database, migrating it
        run: npm run build
        env:
          DATABASE_URL: postgres://spec:spec@localhost:5432/spec_ci

      # The failure that cost months, reproduced so it cannot return.
      #
      # The deploy-time migration used to refuse to touch a database holding anything the build did
      # not recognise. One forgotten table in production therefore meant NO schema change reached it
      # again — silently, for months, while every build stayed green. By 12 September production was
      # missing nine tables and seventeen columns and the product looked broken.
      #
      # So: put a table there that the build has never heard of, migrate, and require the result to
      # be a database that matches the build with the stranger still sitting in it untouched.
      - name: A forgotten table must not stop the database being brought up to date
        env:
          DATABASE_URL: postgres://spec:spec@localhost:5432/spec_ci
        run: |
          psql "$DATABASE_URL" -c 'create table if not exists a_forgotten_experiment (id text primary key, kept text)'
          psql "$DATABASE_URL" -c "insert into a_forgotten_experiment values ('1','do not lose me') on conflict do nothing"
          psql "$DATABASE_URL" -c 'alter table tenants drop column if exists tier'
          psql "$DATABASE_URL" -c 'drop table if exists obligations'

          npx tsx scripts/deploy-migrate.ts

          psql "$DATABASE_URL" -c 'select tier from tenants limit 0'
          psql "$DATABASE_URL" -c 'select id from obligations limit 0'
          test "$(psql "$DATABASE_URL" -t -A -c "select kept from a_forgotten_experiment")" = 'do not lose me'
          echo "brought up to date, and the stranger is untouched"

      # The same lesson, applied to security: the policy file used to say it should be "applied
      # once, by hand, via the Supabase SQL editor". Nobody ever did, for months. A safeguard that
      # depends on somebody remembering a manual step is a safeguard you do not have, so the deploy
      # applies it — and this proves the deploy really does, rather than trusting that it would.
      - name: The deploy applies the security policies, not a person
        env:
          DATABASE_URL: postgres://spec:spec@localhost:5432/spec_ci
        run: |
          # Supabase supplies auth.uid(); a plain Postgres does not. Stubbed so the REAL file runs
          # unmodified, exactly as it will in production.
          psql "$DATABASE_URL" -c 'create schema if not exists auth'
          psql "$DATABASE_URL" -c 'create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$'
          psql "$DATABASE_URL" -c "drop policy if exists tenant_isolation on tenants"

          npx tsx scripts/deploy-migrate.ts | tee /tmp/migrate.log
          grep -q 'Row-level security applied' /tmp/migrate.log

          count=$(psql "$DATABASE_URL" -t -A -c "select count(*) from pg_policies where policyname = 'tenant_isolation'")
          echo "tables carrying the tenant policy: $count"
          test "$count" -ge 20

      # Row-level security, applied for real and then inspected.
      #
      # drizzle/0001_rls.sql needs Supabase's auth.uid(), so it could never be applied by our own
      # Postgres — which meant nobody had ever run it. It referenced a table that does not exist and
      # aborted partway through, silently skipping every policy below that line. This stubs auth.uid()
      # and applies the real file unmodified, then asks the database what it actually got.
      - name: Apply the row-level security policies and check them
        run: npm run db:check-rls
        env:
          DATABASE_URL: postgres://spec:spec@localhost:5432/spec_ci

      # Running it twice proves the migration is idempotent — every deploy after the first is this.
      - name: Build again, to prove the migration repeats safely
        run: npm run build
        env:
          DATABASE_URL: postgres://spec:spec@localhost:5432/spec_ci

      # "It compiled" and "it serves" are different claims. This is the one that matters, and it is
      # the check that would have caught every failure this project has had.
      - name: Start it and check it actually serves
        env:
          DATABASE_URL: postgres://spec:spec@localhost:5432/spec_ci
          APP_URL: http://localhost:3000
        run: |
          # ── Stopped at the end of this step, and that matters ──────────────────────────────────
          #
          # This one is started with NO Supabase configuration on purpose: the public pages have to
          # serve without it, which is the failure that took production down on 11 September.
          #
          # It used to be left running. The browser step further down then ran its own `npm start`,
          # could not bind to 3000, died — and every journey drove at THIS server instead. Sign-up
          # correctly answered "setting up is temporarily unavailable, that is our end", because for
          # that process it genuinely was: no Supabase URL, no sign-in. Five red checks a run, about
          # a product that was working perfectly.
          #
          # Invisible until today, because the step below used to hang before it ever got here.
          npm start &
          SERVED_PID=$!
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/ && break
            sleep 2
          done

          fail=0
          # The public pages: these must serve with no sign-in and no Supabase configured at all.
          for path in / /how /sectors /pricing; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done

          # A signed-out visitor must be redirected, never shown an error.
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000/today")
          echo "/today (signed out) -> $code"
          case "$code" in 200|30[0-9]) ;; *) fail=1 ;; esac

          # The database was migrated by the build above, so the schema check must pass.
          echo "--- /api/health ---"
          curl -s http://localhost:3000/api/health | tee /tmp/health.json
          echo
          node -e '
            const h = require("/tmp/health.json");
            if (h.schema?.status !== "ok") {
              console.error("Schema is not ok after the build migrated it:", JSON.stringify(h.schema));
              process.exit(1);
            }
            console.log("schema ok:", h.schema.tables, "tables");
          ' || fail=1

          # ── Hand the port back, properly ───────────────────────────────────────────────────────
          #
          # `npm start &` gives the PID of NPM, not of the next-server it spawns, and npm does not
          # pass the signal on. Killing $SERVED_PID therefore left the real server running and the
          # step below refused to start — which is the guard working, and was still the wrong
          # outcome. So the port itself is taken back, by whoever is holding it.
          # By process name, not by port. `lsof` is not on a GitHub runner, so the loop that asked
          # it for the listener found nothing, killed nothing, and the step below — correctly —
          # refused to run against the server that was still there. A tool that is absent returns
          # no output, which reads exactly like a port that is already free.
          kill "$SERVED_PID" 2>/dev/null || true
          pkill -f 'next-server' 2>/dev/null || true
          pkill -f 'next start' 2>/dev/null || true
          # And if either IS available, use it too — belt and braces cost nothing here.
          command -v fuser >/dev/null 2>&1 && fuser -k 3000/tcp 2>/dev/null || true
          for pid in $(command -v lsof >/dev/null 2>&1 && lsof -ti tcp:3000 2>/dev/null); do
            kill -9 "$pid" 2>/dev/null || true
          done

          freed=
          for _ in $(seq 1 15); do
            curl -sS -o /dev/null --max-time 1 http://localhost:3000/ || { freed=1; break; }
            sleep 1
          done
          if [ -z "$freed" ]; then
            echo "::error title=port 3000::could not be freed after this step"
            fail=1
          fi

          exit $fail

      # The journey every customer takes, driven in a real browser.
      #
      # This is the check that ends a whole class of problem. The happy path — look around, sign up,
      # keep what you were looking at, come back tomorrow, sign in — could previously only be
      # verified by reading the code, because it needs a real authentication service. It now runs
      # against scripts/fake-auth, which speaks enough of the provider's HTTP API for the real
      # client to talk to it unmodified: what is tested is the shipping code path, with no test-only
      # branch anywhere in the product.
      - name: Install a browser
        run: npx playwright install --with-deps chromium

      - name: Walk the whole customer journey in a browser
        # Its own budget, so running out of time is reported as a FAILURE rather than as a quiet
        # cancellation of the whole job. See the note on timeout-minutes above.
        timeout-minutes: 45
        env:
          DATABASE_URL: postgres://spec:spec@localhost:5432/spec_ci
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          APP_URL: http://localhost:3000
          NODE_ENV: test
        run: |
          # ── Why each journey is timed and fenced ────────────────────────────────────────────
          #
          # This step ran out of time twice and the run said only that the step ran out of time. The
          # logs are the one place that would have said WHICH journey, and reading them from a
          # sandbox is not always possible — so the step is made to say it itself, through
          # annotations, which come back on the ordinary API alongside the run.
          #
          # Each journey gets seven minutes. One that hangs now fails in seven minutes WITH ITS NAME
          # on it, instead of eating the whole budget anonymously and leaving the next person to
          # guess. Same rule as everywhere else here: a failure nobody can locate is barely better
          # than no failure at all.
          journey () {
            local script="$1" start=$SECONDS code=0 log="/tmp/$1.log"
            # .mts runs through tsx, because it imports the product's own TypeScript rather than
            # driving a browser — the delete guard is worth checking against the real function.
            local runner=(node); case "$script" in *.mts) runner=(npx tsx);; esac
            timeout 420 "${runner[@]}" "scripts/$script" 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            local took=$((SECONDS - start))
            if [ "$code" -eq 0 ]; then
              echo "::notice title=$script::passed in ${took}s"
              return 0
            fi
            if [ "$code" -eq 124 ]; then
              echo "::error title=$script::HUNG — still running after ${took}s, and was stopped"
            else
              echo "::error title=$script::failed after ${took}s (exit $code)"
            fi
            # ── Say WHICH check, not just which journey ─────────────────────────────────────────
            #
            # Every journey prints "FAIL <the thing that is not true>". Those lines are the entire
            # value of the journey and they were going only to the log — which is served from a host
            # that is not always reachable, so a failure could be seen and not read. Lifting them
            # into annotations means the run carries its own explanation wherever it is read from.
            grep -E '(^|[[:space:]])FAIL' "$log" | head -8 | while IFS= read -r line; do
              echo "::error title=$script::${line}"
            done
            return 1
          }

          node scripts/fake-auth.mjs 54321 &

          # ── Wait for the stand-in, WITHOUT -f ────────────────────────────────────────────────
          #
          # This line is where every run since 64ce20e actually died.
          #
          # It was `until curl -fsS ...; do sleep 1; done`. fake-auth answers **401** on that route,
          # which is correct — nobody is signed in — and `curl -f` treats 401 as a failure. So the
          # loop could never exit. The step spun on its first line for the whole budget: no build, no
          # journeys, no output. Raising the timeout twice made the spin longer, and my own reading
          # of it — "the runner is just slower than a laptop" — was wrong, and was only shown to be
          # wrong once each journey started reporting its own time and NONE of them reported at all.
          #
          # scripts/check.mjs has carried a comment about this exact trap for days. CI never got it.
          #
          # So: any answer at all means it is up, the wait is bounded, and running out says so.
          up=
          for _ in $(seq 1 30); do
            curl -sS -o /dev/null --max-time 3 http://localhost:54321/auth/v1/user && { up=1; break; }
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "::error title=fake-auth::never answered on :54321 after 30s"
            exit 1
          fi

          # Rebuilt so the client is compiled against the stand-in, then started for real.
          # Timed, because it shares this step's budget with ten browser journeys and until now
          # nobody knew which of the two was eating it.
          BUILD_START=$SECONDS
          npm run build
          echo "::notice title=npm run build::$((SECONDS - BUILD_START))s"
          # ── Nobody else's server ───────────────────────────────────────────────────────────────
          #
          # If something is already on 3000, `npm start` cannot bind, dies quietly, and every journey
          # below drives at whatever IS there. That is exactly what happened: the step above left a
          # copy running that was started with no Supabase configuration on purpose, so sign-up
          # answered "that is our end" for nine runs in a row while the product was perfect.
          if curl -sS -o /dev/null --max-time 2 http://localhost:3000/; then
            echo "::error title=port 3000::something was already serving before this step started it"
            exit 1
          fi

          npm start &
          serving=
          for _ in $(seq 1 40); do
            curl -fsS -o /dev/null http://localhost:3000/ && { serving=1; break; }
            sleep 2
          done
          # Say so, rather than running nine journeys against nothing and reporting nine failures
          # that all mean the same thing.
          if [ -z "$serving" ]; then
            echo "::error title=npm start::the app never served on :3000"
            exit 1
          fi

          # And prove it is the one we meant: a server without a sign-in configured can serve every
          # public page perfectly and fail every journey, which is indistinguishable from a broken
          # product unless somebody asks. So ask.
          curl -s http://localhost:3000/api/health > /tmp/journey-health.json
          node -e '
            const h = require("/tmp/journey-health.json");
            const missing = h.missing ?? [];
            if (missing.length) {
              console.error("::error title=wrong server::the app on :3000 is missing " + missing.join(", "));
              process.exit(1);
            }
            console.log("::notice title=app on :3000::wired, nothing missing");
          '

          journey journey.mjs

          # The improvement register, all the way through: a problem typed in plain words,
          # read, ranked, assigned, accepted, marked done, and raised again as one entry
          # rather than two. It is the mechanism the front door and My Page share, so a
          # break here is a break in both.
          journey register-journey.mjs

          # The front door: a stranger with a problem becomes a business with that problem
          # already in its register. The landing page promises this literally -- "your page
          # is waiting, with this problem already sitting in the middle of it" -- so the last
          # check is whether the thing they typed on a public page is really there afterwards.
          journey frontdoor-journey.mjs

          # What the business is FOR, and it staying said. The design puts this before any role
          # or KPI exists and promises it stays visible on the board pack and the monthly
          # scoring page. Both halves of that are claims about what a customer SEES, which no
          # unit test can make -- so they are driven here, in a browser, against a real save.
          journey goals-journey.mjs

          # What the chart is missing, and who decides. Runs with NO api key on purpose: SPEC
          # Basic is a complete way to run the system, so the structural reading has to stand on
          # its own. Also proves the part that makes this trustworthy rather than annoying -- a
          # denied role is never proposed again, however many times the chart is read.
          journey predict-journey.mjs

          # The goal reaching a scorecard. The check that matters is the last one: SPEC may
          # suggest what a role measures, and may NEVER set the number a person is judged
          # against. So it opens the role's own KPI page and confirms the agreed target is still
          # empty, waiting for the conversation, with the suggestion on record as a proposal.
          journey cascade-journey.mjs

          # Which parts of a role a process could do, and -- the part worth a browser -- who can
          # see that. Read one desk down it is a page about whether somebody still has a job,
          # while it is still a proposal. A unit test proves the function says no; only a real
          # request proves the page and the WRITE both refuse.
          journey automation-journey.mjs

          # Can a business that wants to pay actually start? On 16 September the answer was no:
          # checkout existed, worked, was unit-tested, and was reachable only from a button that
          # appears after a subscription has already FAILED. Every test passed because they all
          # tested the rooms rather than whether you could get into the building.
          journey pay-journey.mjs

          # Taking a seat somebody gave you -- the other half of the way in, and the one that
          # reaches every person in a customer's business except the owner. Single use,
          # expiring, bound to that address, and a refusal that never says "invalid token".
          # Boards — the live artifacts a team pins and argues over. The check that matters most is
          # that a board whose feeds are not connected never claims to be live: "partly current"
          # reads as "current", on the screen where somebody drops a sell rate by ten dollars an hour.
          journey boards-journey.mjs

          journey seat-journey.mjs

          # Clearing a test business, and — the half that matters — every guard that stops the wrong
          # one going. A business Stripe has ever heard of is refused however carefully it is typed,
          # and a table somebody forgot rolls the whole thing back rather than half-deleting a
          # business. Proven by taking a table out of the list and watching it refuse.
          journey delete-journey.mts

          # Help, walked by somebody who is NOT signed in — which is the whole point of it, since
          # the person who most needs help is the one who cannot get in. The unit tests hold every
          # answer to a real route and a real button; this proves the page opens for a stranger,
          # that searching in their own words finds the answer, and that following one genuinely
          # lands in front of the button it named.
          journey help-journey.mjs

          # How simple, intuitive and responsive it actually is — measured on every change rather
          # than agreed with once. Every door timed, every page opened again at 390px of phone,
          # everything pressable measured against WCAG's floors. Without this in CI it is a
          # one-afternoon audit, and a page gets slower or narrower one change at a time because no
          # single change ever made it bad.
          journey usability-journey.mjs
