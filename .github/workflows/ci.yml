# Nothing reaches production without passing this.
#
# The repository had no automated checks at all, which meant every safeguard was somebody
# remembering to run it by hand. That is how a broken build reached production on 11 September:
# the change was verified locally, against a database, with the dev dependencies installed — none
# of which is what the deploy environment actually looks like.
#
# So this deliberately reproduces the conditions that broke, rather than the conditions that work:
# it builds once with NO database, and once against a real empty one to prove the deploy-time
# migration creates the schema from nothing. Then it starts the built app and asks it for pages,
# because "it compiled" and "it serves" are different claims and only the second one matters.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push makes an older run pointless. Never cancel on main — those runs are the record of
# what was actually shipped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spec
          POSTGRES_PASSWORD: spec
          POSTGRES_DB: spec_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      # Is the design set whole? Fails if a screen the designs link to was never sent, or if the
      # folder holds screens from more than one export.
      #
      # This was reported rather than enforced, on the reasoning that an incomplete export is a fact
      # about what arrived rather than a fault in the change being tested. That was right while the
      # set was incomplete. It is complete now — 21 screens, one export — and the job of this step
      # has changed from chasing a gap to holding a state, which is what a build check is for.
      - name: Is every design screen actually here
        run: node scripts/design-check.mjs --strict

      # What each design screen says, against what the code says — and now a RATCHET rather than a
      # report. Rewording stays free, because a reworded phrase still counts as present. What cannot
      # happen is coverage going down: wording the product carries today cannot quietly leave it.
      #
      # Both tiers are held. The headline pass covers headings and buttons; --deep covers every
      # label, which is noisier and is where three whole features were once found missing.
      - name: What the designs say, against what the code says
        run: |
          node scripts/design-coverage.mjs --enforce
          node scripts/design-coverage.mjs --deep --enforce

      # The exact shape of the failure that took production down. The public pages need no
      # database, so a build without one has to succeed — if this step ever fails, the marketing
      # site would have gone down over a missing setting.
      - name: Build with no database configured
        run: npm run build
        env:
          DATABASE_URL: ''

      # Proves the deploy-time migration can build the schema from nothing, which is what a new
      # environment looks like on its first deploy.
      - name: Build against an empty database, migrating it
        run: npm run build
        env:
          DATABASE_URL: postgres://spec:spec@localhost:5432/spec_ci

      # The failure that cost months, reproduced so it cannot return.
      #
      # The deploy-time migration used to refuse to touch a database holding anything the build did
      # not recognise. One forgotten table in production therefore meant NO schema change reached it
      # again — silently, for months, while every build stayed green. By 12 September production was
      # missing nine tables and seventeen columns and the product looked broken.
      #
      # So: put a table there that the build has never heard of, migrate, and require the result to
      # be a database that matches the build with the stranger still sitting in it untouched.
      - name: A forgotten table must not stop the database being brought up to date
        env:
          DATABASE_URL: postgres://spec:spec@localhost:5432/spec_ci
        run: |
          psql "$DATABASE_URL" -c 'create table if not exists a_forgotten_experiment (id text primary key, kept text)'
          psql "$DATABASE_URL" -c "insert into a_forgotten_experiment values ('1','do not lose me') on conflict do nothing"
          psql "$DATABASE_URL" -c 'alter table tenants drop column if exists tier'
          psql "$DATABASE_URL" -c 'drop table if exists obligations'

          npx tsx scripts/deploy-migrate.ts

          psql "$DATABASE_URL" -c 'select tier from tenants limit 0'
          psql "$DATABASE_URL" -c 'select id from obligations limit 0'
          test "$(psql "$DATABASE_URL" -t -A -c "select kept from a_forgotten_experiment")" = 'do not lose me'
          echo "brought up to date, and the stranger is untouched"

      # The same lesson, applied to security: the policy file used to say it should be "applied
      # once, by hand, via the Supabase SQL editor". Nobody ever did, for months. A safeguard that
      # depends on somebody remembering a manual step is a safeguard you do not have, so the deploy
      # applies it — and this proves the deploy really does, rather than trusting that it would.
      - name: The deploy applies the security policies, not a person
        env:
          DATABASE_URL: postgres://spec:spec@localhost:5432/spec_ci
        run: |
          # Supabase supplies auth.uid(); a plain Postgres does not. Stubbed so the REAL file runs
          # unmodified, exactly as it will in production.
          psql "$DATABASE_URL" -c 'create schema if not exists auth'
          psql "$DATABASE_URL" -c 'create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$'
          psql "$DATABASE_URL" -c "drop policy if exists tenant_isolation on tenants"

          npx tsx scripts/deploy-migrate.ts | tee /tmp/migrate.log
          grep -q 'Row-level security applied' /tmp/migrate.log

          count=$(psql "$DATABASE_URL" -t -A -c "select count(*) from pg_policies where policyname = 'tenant_isolation'")
          echo "tables carrying the tenant policy: $count"
          test "$count" -ge 20

      # Row-level security, applied for real and then inspected.
      #
      # drizzle/0001_rls.sql needs Supabase's auth.uid(), so it could never be applied by our own
      # Postgres — which meant nobody had ever run it. It referenced a table that does not exist and
      # aborted partway through, silently skipping every policy below that line. This stubs auth.uid()
      # and applies the real file unmodified, then asks the database what it actually got.
      - name: Apply the row-level security policies and check them
        run: npm run db:check-rls
        env:
          DATABASE_URL: postgres://spec:spec@localhost:5432/spec_ci

      # Running it twice proves the migration is idempotent — every deploy after the first is this.
      - name: Build again, to prove the migration repeats safely
        run: npm run build
        env:
          DATABASE_URL: postgres://spec:spec@localhost:5432/spec_ci

      # "It compiled" and "it serves" are different claims. This is the one that matters, and it is
      # the check that would have caught every failure this project has had.
      - name: Start it and check it actually serves
        env:
          DATABASE_URL: postgres://spec:spec@localhost:5432/spec_ci
          APP_URL: http://localhost:3000
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/ && break
            sleep 2
          done

          fail=0
          # The public pages: these must serve with no sign-in and no Supabase configured at all.
          for path in / /how /sectors /pricing; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done

          # A signed-out visitor must be redirected, never shown an error.
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000/today")
          echo "/today (signed out) -> $code"
          case "$code" in 200|30[0-9]) ;; *) fail=1 ;; esac

          # The database was migrated by the build above, so the schema check must pass.
          echo "--- /api/health ---"
          curl -s http://localhost:3000/api/health | tee /tmp/health.json
          echo
          node -e '
            const h = require("/tmp/health.json");
            if (h.schema?.status !== "ok") {
              console.error("Schema is not ok after the build migrated it:", JSON.stringify(h.schema));
              process.exit(1);
            }
            console.log("schema ok:", h.schema.tables, "tables");
          ' || fail=1

          exit $fail

      # The journey every customer takes, driven in a real browser.
      #
      # This is the check that ends a whole class of problem. The happy path — look around, sign up,
      # keep what you were looking at, come back tomorrow, sign in — could previously only be
      # verified by reading the code, because it needs a real authentication service. It now runs
      # against scripts/fake-auth, which speaks enough of the provider's HTTP API for the real
      # client to talk to it unmodified: what is tested is the shipping code path, with no test-only
      # branch anywhere in the product.
      - name: Install a browser
        run: npx playwright install --with-deps chromium

      - name: Walk the whole customer journey in a browser
        env:
          DATABASE_URL: postgres://spec:spec@localhost:5432/spec_ci
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          APP_URL: http://localhost:3000
          NODE_ENV: test
        run: |
          node scripts/fake-auth.mjs 54321 &
          until curl -fsS -o /dev/null http://localhost:54321/auth/v1/user; do sleep 1; done

          # Rebuilt so the client is compiled against the stand-in, then started for real.
          npm run build
          npm start &
          for i in $(seq 1 40); do
            curl -fsS -o /dev/null http://localhost:3000/ && break
            sleep 2
          done

          node scripts/journey.mjs

          # The improvement register, all the way through: a problem typed in plain words,
          # read, ranked, assigned, accepted, marked done, and raised again as one entry
          # rather than two. It is the mechanism the front door and My Page share, so a
          # break here is a break in both.
          node scripts/register-journey.mjs

          # The front door: a stranger with a problem becomes a business with that problem
          # already in its register. The landing page promises this literally -- "your page
          # is waiting, with this problem already sitting in the middle of it" -- so the last
          # check is whether the thing they typed on a public page is really there afterwards.
          node scripts/frontdoor-journey.mjs

          # Taking a seat somebody gave you -- the other half of the way in, and the one that
          # reaches every person in a customer's business except the owner. Single use,
          # expiring, bound to that address, and a refusal that never says "invalid token".
          node scripts/seat-journey.mjs
